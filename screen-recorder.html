<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Recorder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #333; }
        .quality-section {
            background: #f7fafc;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .quality-section label {
            margin-right: 20px;
            cursor: pointer;
        }
        .controls {
            display: flex;
            gap: 12px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-start { background: #48bb78; color: white; }
        .btn-stop { background: #e53e3e; color: white; }
        .btn-upload { background: #2196f3; color: white; }
        .preview-container {
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }
        video {
            width: 100%;
            max-height: 400px;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .status.recording {
            display: block;
            background: #fed7d7;
            color: #c53030;
        }
        .status.success {
            display: block;
            background: #c6f6d5;
            color: #22543d;
        }
        .recording-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #e53e3e;
            border-radius: 50%;
            animation: pulse 1s infinite;
            margin-right: 8px;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            display: none;
        }
        .filename {
            font-family: monospace;
            background: #f5f5f5;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 Screen Recorder</h1>
        <p>Record your screen and upload directly to your server</p>
        
        <div class="quality-section">
            <strong>Recording Quality:</strong><br>
            <label><input type="radio" name="quality" value="low" checked> Low (480p)</label>
            <label><input type="radio" name="quality" value="medium"> Medium (720p)</label>
            <label><input type="radio" name="quality" value="high"> High (1080p)</label>
        </div>
        
        <div class="controls">
            <button id="startBtn" class="btn-start">🎬 Start Recording</button>
            <button id="stopBtn" class="btn-stop" disabled>⏹️ Stop Recording</button>
            <button id="uploadBtn" class="btn-upload" disabled>📤 Upload to Server</button>
        </div>
        
        <div class="preview-container">
            <video id="preview" autoplay muted playsinline></video>
        </div>
        
        <div id="status" class="status"></div>
        <div id="result" class="result">
            <strong>✅ Upload Successful!</strong>
            <div id="filename" class="filename"></div>
            <button onclick="copyFilename()">📋 Copy Filename</button>
            <button onclick="goToAdmin()">📝 Go to Admin Panel</button>
        </div>
    </div>

    <script>
        let mediaRecorder = null;
        let recordedChunks = [];
        let stream = null;
        let recordedBlob = null;
        let currentFilename = '';
        
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const preview = document.getElementById('preview');
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const filenameDisplay = document.getElementById('filename');
        
        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
        }
        
        function getQualitySettings(quality) {
            const settings = {
                low: { width: 854, height: 480, frameRate: 15, bitrate: 500000 },
                medium: { width: 1280, height: 720, frameRate: 24, bitrate: 1000000 },
                high: { width: 1920, height: 1080, frameRate: 30, bitrate: 1500000 }
            };
            return settings[quality] || settings.low;
        }
        
        startBtn.addEventListener('click', async () => {
            try {
                const quality = document.querySelector('input[name="quality"]:checked').value;
                const settings = getQualitySettings(quality);
                
                const screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: { ideal: settings.width }, height: { ideal: settings.height } },
                    audio: true
                });
                
                let audioStream = null;
                try {
                    audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const tracks = [...screenStream.getVideoTracks(), ...audioStream.getAudioTracks()];
                    stream = new MediaStream(tracks);
                } catch (err) {
                    stream = screenStream;
                }
                
                preview.srcObject = stream;
                recordedChunks = [];
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };
                
                mediaRecorder.onstop = () => {
                    recordedBlob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(recordedBlob);
                    preview.srcObject = null;
                    preview.src = url;
                    preview.controls = true;
                    showStatus(`✅ Recording complete! Size: ${(recordedBlob.size/1024).toFixed(2)} KB`, 'success');
                    uploadBtn.disabled = false;
                    if (stream) stream.getTracks().forEach(track => track.stop());
                };
                
                mediaRecorder.start(1000);
                startBtn.disabled = true;
                stopBtn.disabled = false;
                showStatus('🔴 Recording...', 'recording');
                
            } catch (err) {
                showStatus('❌ Error: ' + err.message, 'error');
            }
        });
        
        stopBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                startBtn.disabled = false;
                stopBtn.disabled = true;
            }
        });
        
        uploadBtn.addEventListener('click', async () => {
            if (!recordedBlob || recordedBlob.size === 0) {
                alert('No recording to upload!');
                return;
            }
            
            showStatus('📤 Uploading...', 'info');
            uploadBtn.disabled = true;
            
            const formData = new FormData();
            formData.append('video', recordedBlob, 'recording_' + Date.now() + '.webm');
            
            try {
                const response = await fetch('upload_screen_recording.php', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    currentFilename = result.filename;
                    filenameDisplay.textContent = currentFilename;
                    resultDiv.style.display = 'block';
                    showStatus('✅ Upload successful!', 'success');
                } else {
                    showStatus('❌ Upload failed: ' + result.error, 'error');
                    uploadBtn.disabled = false;
                }
            } catch (err) {
                showStatus('❌ Upload failed: ' + err.message, 'error');
                uploadBtn.disabled = false;
            }
        });
        
        function copyFilename() {
            navigator.clipboard.writeText(currentFilename);
            alert('Filename copied: ' + currentFilename);
        }
        
        function goToAdmin() {
            window.location.href = 'add_content.php';
        }
    </script>
</body>
</html>
